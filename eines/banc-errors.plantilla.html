<script>
const DADES = /*DADES*/;
const SECCIONS = [
 { id: 'equacions', nom: 'Equacions de 1r grau', sub: "" },
 { id: 'prioritat', nom: "Prioritat d'operacions", sub: '' }
];
const VOTS = [['MM', "M'agrada molt"], ['M', "M'agrada"], ['N', "No m'agrada"]];
const CLAU = 'banc-errors-' + DADES.versio;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fm = s => esc(s).replace(/\{([^|{}]+)\|([^|{}]+)\}/g, '<span class="fr"><span>$1</span><span>$2</span></span>').replace(/x/g, '<i>x</i>').replace(/\^(\d+)/g, '<sup>$1</sup>');
const txt = s => String(s).split('$').map((p, k) => (k % 2 ? `<span class="fx">${fm(p)}</span>` : esc(p))).join('');

let E = { nom: '', v: {}, c: {} };
try { const t = localStorage.getItem(CLAU); if (t) E = Object.assign(E, JSON.parse(t)); } catch (e) {}
const desa = () => { try { localStorage.setItem(CLAU, JSON.stringify(E)); } catch (e) {} };

function linia(it, L, i) {
 const q = L.indexOf('=');
 const esq = q < 0 ? [] : L.slice(0, q), dre = q < 0 ? L : L.slice(q + 1), off = q < 0 ? 0 : q + 1;
 const mal = i === it.j;
 const t = (tok, k) => `<span class="t${mal && it.termes.includes(k) ? ' mal' : ''}">${fm(tok)}</span>`;
 return `<span class="ln">${i}</span>`
  + `<span class="mb f${i === 0 ? ' l0' : ''}">${esq.map((tok, k) => t(tok, k)).join('')}</span>`
  + `<span class="ig f">${q < 0 ? '' : '='}</span>`
  + `<span class="mb d f">${dre.map((tok, k) => t(tok, k + off)).join('')}</span>`
  + `<span class="creu">${mal ? '✗' : ''}</span>`;
}
function fitxa(it) {
 const fet = it.seccio === 'equacions' ? 'ha resolt aquesta equació' : 'ha calculat aquesta expressió';
 const v = E.v[it.n] || '';
 return `<article class="fitxa${v ? ' valorada' : ''}" id="e${it.n}">
 <div class="cap"><span class="num">${it.n}</span><h3>${esc(it.nom)}</h3></div>
 <p class="desc">${txt(it.descripcio)}</p>
 <p class="enunciat">${esc(it.alumne.charAt(0).toUpperCase() + it.alumne.slice(1))} ${fet}:</p>
 <div class="llibreta"><div class="linies">${it.linies.map((L, i) => linia(it, L, i).replace(/<span class="(mb|ig)/g, i === 0 ? '<span class="$1 l0' : '<span class="$1')).join('')}</div></div>
 <div class="correccio"><div class="bona">Havia de ser: <span class="fx">${fm(it.bona)}</span></div><div class="expl">${txt(it.expl)}</div></div>
 <div class="vots" role="group" aria-label="Valoració de l'exemple ${it.n}">${VOTS.map(([k, t]) => `<button type="button" data-n="${it.n}" data-v="${k}" aria-pressed="${v === k}">${t}</button>`).join('')}</div>
 <label class="vh" for="c${it.n}" style="position:absolute;left:-9999px">Comentari de l'exemple ${it.n}</label>
 <textarea id="c${it.n}" data-n="${it.n}" placeholder="Comentari (opcional): per què t'agrada o no, quina errada hi posaries…">${esc(E.c[it.n] || '')}</textarea>
 <div class="origen">${it.origen === 'banc' ? 'Exemple revisat a mà' : it.origen === 'fix' ? 'Enunciat triat a mà' : 'Exemple del generador'} · tipus ${esc(it.id)}</div>
</article>`;
}
function pinta() {
 $('#seccions').innerHTML = SECCIONS.map(s => {
  const its = DADES.items.filter(i => i.seccio === s.id);
  return `<section id="${s.id}"><h2>${esc(s.nom)} <small style="color:var(--mut);font-weight:400">(${its[0].n}–${its[its.length - 1].n})</small></h2>${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ''}${its.map(fitxa).join('')}</section>`;
 }).join('');
 compta();
}
function compta() {
 const n = DADES.items.filter(i => E.v[i.n]).length;
 $('#compta').textContent = `Valorats: ${n} de ${DADES.items.length}`;
}
function codi() {
 const net = s => String(s || '').replace(/\s+/g, ' ').trim();
 const l = [`BANC-ERRORS ${DADES.versio}`, 'Llegenda: MM = M\'agrada molt · M = M\'agrada · N = No m\'agrada · - = sense valorar'];
 for (const it of DADES.items) {
  const c = net(E.c[it.n]);
  l.push(`${it.n} ${E.v[it.n] || '-'}${c ? ' | ' + c : ''}`);
 }
 l.push('FI');
 return l.join('\n');
}
function avis(t) {
 const d = document.createElement('div'); d.className = 'avis'; d.setAttribute('role', 'status'); d.textContent = t;
 document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
}
function modal(t) {
 const m = document.createElement('div'); m.className = 'modal';
 m.innerHTML = `<div class="caixa" role="dialog" aria-label="Codi amb les preferències"><p>Selecciona tot el text i copia'l (Ctrl+C o ⌘C):</p><textarea readonly></textarea><div class="peu"><button type="button">Tanca</button></div></div>`;
 document.body.appendChild(m);
 const ta = m.querySelector('textarea'); ta.value = t; ta.focus(); ta.select();
 const tanca = () => m.remove();
 m.querySelector('button').addEventListener('click', tanca);
 m.addEventListener('click', ev => { if (ev.target === m) tanca(); });
}
let temps = null;
function copiat() {
 const b = $('#copia');
 b.classList.add('fet'); b.textContent = 'Codi copiat';
 clearTimeout(temps);
 temps = setTimeout(() => { b.classList.remove('fet'); b.textContent = 'Copia codi amb les preferències'; }, 5000);
}
$('#copia').addEventListener('click', () => {
 const t = codi();
 const n = DADES.items.filter(i => E.v[i.n]).length;
 const queden = DADES.items.length - n;
 const msg = queden ? `Codi copiat. Encara en queden ${queden} sense valorar.` : 'Codi copiat. Enganxa\'l en un correu per al David.';
 try {
  navigator.clipboard.writeText(t).then(() => { avis(msg); copiat(); }, () => modal(t));
 } catch (e) { modal(t); }
});
document.addEventListener('click', ev => {
 const b = ev.target.closest('button[data-v]'); if (!b) return;
 const n = b.dataset.n;
 E.v[n] = E.v[n] === b.dataset.v ? '' : b.dataset.v;
 desa();
 const f = document.getElementById('e' + n);
 f.classList.toggle('valorada', !!E.v[n]);
 f.querySelectorAll('button[data-v]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === E.v[n])));
 compta();
});
document.addEventListener('input', ev => {
 const t = ev.target;
 if (t.matches('textarea[data-n]')) { E.c[t.dataset.n] = t.value; desa(); }
});
$('#amaga').addEventListener('change', ev => document.body.classList.toggle('sense', ev.target.checked));
pinta();
/* ===== Mode resultats (#resultats): llegeix el .docx amb els correus i calcula les puntuacions ===== */
const PUNTS = { MM: 3, M: 2, '-': 0, N: -4 };
/*PUR:inici*/
// --- ZIP mínim (sense llibreries): només el que cal per llegir word/document.xml ---
function llegeixZip(buf) {
 const d = new DataView(buf), n = buf.byteLength;
 let e = -1;
 for (let i = n - 22; i >= Math.max(0, n - 22 - 65535); i--) if (d.getUint32(i, true) === 0x06054b50) { e = i; break; }
 if (e < 0) throw new Error('NO_ZIP');
 const cnt = d.getUint16(e + 10, true);
 let p = d.getUint32(e + 16, true);
 const mapa = new Map(), td = new TextDecoder();
 for (let k = 0; k < cnt; k++) {
  if (p + 46 > n || d.getUint32(p, true) !== 0x02014b50) throw new Error('NO_ZIP');
  const nl = d.getUint16(p + 28, true), el = d.getUint16(p + 30, true), cl = d.getUint16(p + 32, true);
  const nom = td.decode(new Uint8Array(buf, p + 46, nl));
  mapa.set(nom, { nom, metode: d.getUint16(p + 10, true), comp: d.getUint32(p + 20, true), offset: d.getUint32(p + 42, true) });
  p += 46 + nl + el + cl;
 }
 return mapa;
}
async function extreuZip(buf, en) {
 const d = new DataView(buf), o = en.offset;
 if (o + 30 > buf.byteLength || d.getUint32(o, true) !== 0x04034b50) throw new Error('NO_ZIP');
 const ini = o + 30 + d.getUint16(o + 26, true) + d.getUint16(o + 28, true);
 if (ini + en.comp > buf.byteLength) throw new Error('NO_ZIP');
 const bytes = new Uint8Array(buf, ini, en.comp);
 if (en.metode === 0) return bytes.slice();
 if (en.metode !== 8) throw new Error('METODE');
 if (typeof DecompressionStream === 'undefined') throw new Error('SENSE_DS');
 return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
}
// --- XML de Word → línies de text (sense DOMParser, perquè funcioni també a Node) ---
function desentitat(s) {
 return s.replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g, (m, g) => {
  if (g[0] === '#') {
   const c = g[1] === 'x' ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10);
   try { return String.fromCodePoint(c); } catch (e) { return m; }
  }
  return { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" }[g];
 });
}
function liniesDocx(xml) {
 const out = [];
 for (const p of xml.match(/<w:p(?=[ >])[\s\S]*?<\/w:p>/g) || []) {
  const sensePr = p.replace(/<w:pPr[\s>][\s\S]*?<\/w:pPr>/g, '');
  let t = '';
  for (const m of sensePr.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:(?:tab|br)\b[^>]*\/>/g)) t += m[1] !== undefined ? desentitat(m[1]) : ' ';
  out.push(t);
 }
 return out;
}
// --- Anàlisi: línies → blocs de respondents ---
function analitza(linies, items) {
 const blocs = [], avisos = [];
 const reCap = /^BANC-ERRORS\s+(\S+)\s*$/, reVot = /^(\d+)\s+(MM|M|N|-)(?:\s*\|\s*(.*))?$/;
 let b = null;
 const curta = s => (s.length > 70 ? s.slice(0, 70) + '…' : s);
 for (const crua of linies) {
  const orig = String(crua).replace(/\u00A0/g, ' ').trim();
  if (!orig || /^Llegenda\b/i.test(orig) || /^FI$/i.test(orig)) continue;
  const norm = orig.replace(/[\u2010\u2011\u2012\u2013\u2014\u2212]/g, '-'); // mateixa longitud que orig
  let m = norm.match(reCap);
  if (m) { b = { k: blocs.length + 1, versio: m[1], vots: new Map(), dups: [], errors: [], valid: false }; blocs.push(b); continue; }
  m = norm.match(reVot);
  if (m) {
   if (!b) { avisos.push(`Vot fora de cap bloc (cap línia BANC-ERRORS abans): «${curta(orig)}»`); continue; }
   const n = +m[1];
   const c = m[3] === undefined ? '' : orig.slice(norm.length - m[3].length).replace(/\s+/g, ' ').trim();
   if (b.vots.has(n)) b.dups.push(n); else b.vots.set(n, { v: m[2], c });
   continue;
  }
  avisos.push(b ? `Bloc ${b.k}: línia no reconeguda «${curta(orig)}»` : `Línia no reconeguda abans del primer bloc: «${curta(orig)}»`);
 }
 const llista = a => a.join(', ');
 const nItems = new Set(items.map(i => i.n));
 for (const x of blocs) {
  if (x.versio !== DADES.versio) x.errors.push(`Bloc ${x.k}: versió ${x.versio} ≠ ${DADES.versio}`);
  const dup = [...new Set(x.dups)].sort((a, c) => a - c);
  if (dup.length) x.errors.push(dup.length === 1 ? `Bloc ${x.k}: l'activitat ${dup[0]} apareix més d'una vegada` : `Bloc ${x.k}: les activitats ${llista(dup)} apareixen més d'una vegada`);
  const falten = items.map(i => i.n).filter(n => !x.vots.has(n));
  if (falten.length) x.errors.push(falten.length === 1 ? `Bloc ${x.k}: falta l'activitat ${falten[0]}` : `Bloc ${x.k}: falten les activitats ${llista(falten)}`);
  const sobren = [...x.vots.keys()].filter(n => !nItems.has(n)).sort((a, c) => a - c);
  if (sobren.length) x.errors.push(`Bloc ${x.k}: hi ha activitats que no existeixen: ${llista(sobren)}`);
  x.valid = !x.errors.length;
  avisos.push(...x.errors.map(e => e + ' → bloc exclòs dels totals'));
 }
 return { blocs, avisos };
}
function puntua(valids, items, P) {
 return items.map(it => {
  const r = { n: it.n, MM: 0, M: 0, '-': 0, N: 0, punts: 0, comentaris: [] };
  for (const b of valids) {
   const x = b.vots.get(it.n);
   r[x.v]++; r.punts += P[x.v];
   if (x.c) r.comentaris.push({ resp: b.k, v: x.v, text: x.c });
  }
  return r;
 });
}
// --- Derivats per a la sortida ---
const fp = n => (n < 0 ? '−' + (-n) : String(n));
function ranquing(res) {
 const g = new Map();
 for (const r of res) { if (!g.has(r.punts)) g.set(r.punts, []); g.get(r.punts).push(r.n); }
 return [...g.entries()].sort((a, b) => b[0] - a[0]).map(([p, ns]) => ({ punts: p, ns: ns.sort((a, b) => a - b) }));
}
function destacats(res) {
 const max = res.length ? Math.max(...res.map(r => r.punts)) : 0;
 return { max, ambMax: res.filter(r => r.punts === max).map(r => r.n), negatives: res.filter(r => r.punts < 0).map(r => r.n), ambN: res.filter(r => r.N > 0).length };
}
function resumLinia(R, T, P) {
 let s = `${R} respondents vàlids (de ${T} blocs).`;
 if (R) s += ` Màxim possible: ${P.MM}·R = ${fp(P.MM * R)}; mínim: ${fp(P.N)}·R = ${fp(P.N * R)}.`;
 return s;
}
const fd = (x, d = 2) => String(+x.toFixed(d)).replace('.', ',').replace('-', '−');
function quartils(res) { // [Q1, Q2, Q3] amb interpolació lineal (com QUARTILE.INC); sobre les puntuacions de totes les activitats
 const v = res.map(r => r.punts).sort((a, b) => a - b), n = v.length;
 if (!n) return [0, 0, 0];
 const q = p => { const x = (n - 1) * p, i = Math.floor(x), f = x - i; return i + 1 < n ? v[i] + f * (v[i + 1] - v[i]) : v[i]; };
 return [q(0.25), q(0.5), q(0.75)];
}
// 1 = quartil superior (puntuacions ≥ Q3) … 4 = quartil inferior (< Q1). Els empats van sempre al mateix grup.
const quartilDe = (p, q) => (p >= q[2] ? 1 : p >= q[1] ? 2 : p >= q[0] ? 3 : 4);
// mode: 'cap' | 'cat' (per secció) | 'q' (per quartils). → [{ titol, sub, files, mitjana }], dins de cada grup per número o per punts.
function agrupa(res, items, mode, perPunts, secNoms) {
 const info = new Map(items.map(i => [i.n, i]));
 const ord = a => a.slice().sort((x, y) => (perPunts ? y.punts - x.punts || x.n - y.n : x.n - y.n));
 const mitjana = a => (a.length ? a.reduce((s, r) => s + r.punts, 0) / a.length : 0);
 const grup = (titol, sub, a) => { const f = ord(a); return { titol, sub, files: f, mitjana: mitjana(f) }; };
 if (mode === 'cat') {
  return [...new Set(items.map(i => i.seccio))].map(id => grup((secNoms || {})[id] || id, '', res.filter(r => info.get(r.n).seccio === id))).filter(g => g.files.length);
 }
 if (mode === 'q') {
  const q = quartils(res), nom = ['1r quartil (més ben valorades)', '2n quartil', '3r quartil', '4t quartil (menys ben valorades)'];
  const rang = [`punts ≥ ${fd(q[2])}`, `${fd(q[1])} ≤ punts < ${fd(q[2])}`, `${fd(q[0])} ≤ punts < ${fd(q[1])}`, `punts < ${fd(q[0])}`];
  return [1, 2, 3, 4].map(k => grup(nom[k - 1], rang[k - 1], res.filter(r => quartilDe(r.punts, q) === k))).filter(g => g.files.length);
 }
 return [grup('', '', res)];
}
function tsv(res, items, mode, perPunts, secNoms) { // les 7 primeres columnes no canvien; al final, categoria i quartil
 const info = new Map(items.map(i => [i.n, i])), q = quartils(res);
 const fila = r => [r.n, String(info.get(r.n).nom).replace(/\s+/g, ' '), r.MM, r.M, r['-'], r.N, r.punts, (secNoms || {})[info.get(r.n).seccio] || info.get(r.n).seccio, quartilDe(r.punts, q)].join('\t');
 return ['n\tnom\tMM\tM\t-\tN\tpunts\tcategoria\tquartil'].concat(agrupa(res, items, mode, perPunts, secNoms).flatMap(g => g.files.map(fila))).join('\n');
}
function resumText(res, items, R, T, P, secNoms) {
 const nom = new Map(items.map(i => [i.n, i.nom])), d = destacats(res), l = [`Resultats del banc d'errades (${DADES.versio})`, resumLinia(R, T, P), '', 'Ranquing per puntuació:'];
 for (const g of ranquing(res)) l.push(`${fp(g.punts)}: ${g.ns.join(', ')}`);
 l.push('', `Puntuació màxima (${fp(d.max)}): ${d.ambMax.join(', ')}`, `Puntuació negativa: ${d.negatives.length ? d.negatives.join(', ') : 'cap'}`, `Activitats amb almenys un N: ${d.ambN}`);
 l.push('', 'Per categoria (mitjana de punts):');
 for (const g of agrupa(res, items, 'cat', false, secNoms)) l.push(`${g.titol}: ${fd(g.mitjana, 1)} (${g.files.length} activitats)`);
 const q = quartils(res);
 l.push('', `Quartils de la puntuació: Q1 = ${fd(q[0])}; Q2 = ${fd(q[1])}; Q3 = ${fd(q[2])}`);
 for (const g of agrupa(res, items, 'q', false, secNoms)) l.push(`${g.titol} [${g.sub}]: ${g.files.map(r => r.n).join(', ')}`);
 const amb = res.filter(r => r.comentaris.length);
 if (amb.length) {
  l.push('', 'Comentaris:');
  for (const r of amb) for (const c of r.comentaris) l.push(`${r.n} ${nom.get(r.n)} · Resp. ${c.resp} · ${c.v} · ${c.text}`);
 }
 return l.join('\n');
}
/*PUR:fi*/
// --- Interfície ---
const SEC_NOM = Object.fromEntries(SECCIONS.map(s => [s.id, s.nom]));
let RES = null, ordrePunts = false, agrupaPer = 'cap';
function copiaText(t, ok) {
 try { navigator.clipboard.writeText(t).then(() => avis(ok), () => modal(t)); } catch (e) { modal(t); }
}
function pintaTaula() {
 const { res, R, items } = RES, nom = new Map(items.map(i => [i.n, i])), mx = 3 * R;
 const fila = r => {
  const w = mx ? Math.min(100, Math.abs(r.punts) / mx * 100) : 0;
  return `<tr><td>${r.n}</td><td>${esc(nom.get(r.n).nom)}<small>${esc(SEC_NOM[nom.get(r.n).seccio] || nom.get(r.n).seccio)}</small></td><td>${r.MM}</td><td>${r.M}</td><td>${r['-']}</td><td>${r.N}</td><td class="p"><b>${fp(r.punts)}</b><span class="r-b${r.punts < 0 ? ' neg' : ''}" style="width:${w.toFixed(1)}%"></span></td></tr>`;
 };
 const cap = g => `<tr class="r-gr"><th colspan="7" scope="colgroup">${esc(g.titol)}${g.sub ? ' · ' + esc(g.sub) : ''} · ${g.files.length} ${g.files.length === 1 ? 'activitat' : 'activitats'} · mitjana ${fd(g.mitjana, 1)}</th></tr>`;
 $('#r-taula').innerHTML = `<table><thead><tr><th scope="col">#</th><th scope="col">Activitat</th><th scope="col">MM</th><th scope="col">M</th><th scope="col">−</th><th scope="col">N</th><th scope="col">Punts</th></tr></thead><tbody>`
  + agrupa(res, items, agrupaPer, ordrePunts, SEC_NOM).map(g => (agrupaPer === 'cap' ? '' : cap(g)) + g.files.map(fila).join('')).join('') + '</tbody></table>';
 const b = $('#r-ordena'); b.setAttribute('aria-pressed', String(ordrePunts));
 b.textContent = ordrePunts ? 'Ordena per número' : 'Ordena per punts';
 document.querySelectorAll('#r-detall button[data-g]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.g === agrupaPer)));
}
function mostra(linies) {
 const items = DADES.items;
 const { blocs, avisos } = analitza(linies, items);
 const valids = blocs.filter(b => b.valid), R = valids.length, T = blocs.length;
 $('#r-detall').innerHTML = '';
 if (!T) {
  RES = null;
  $('#r-resum').innerHTML = `<div class="r-av"><b>No s'ha trobat cap bloc.</b> Cada respondent ha de començar amb una línia «BANC-ERRORS ${esc(DADES.versio)}».${avisos.length ? `<ul>${avisos.slice(0, 8).map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : ''}</div>`;
  return;
 }
 const res = puntua(valids, items, PUNTS);
 RES = { res, R, T, items };
 $('#r-resum').innerHTML = `<div class="r-bloc"><p><b>${esc(resumLinia(R, T, PUNTS))}</b></p>`
  + (avisos.length ? `<div class="r-av"><b>Avisos:</b><ul>${avisos.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : '') + '</div>';
 if (!R) return;
 const d = destacats(res), nom = new Map(items.map(i => [i.n, i.nom]));
 const rank = ranquing(res).map(g => `<li><b>${fp(g.punts)}</b>: ${g.ns.join(', ')}</li>`).join('');
 const com = res.filter(r => r.comentaris.length).map(r => `<h3>${r.n} · ${esc(nom.get(r.n))}</h3>` + r.comentaris.map(c => `<p>Resp. ${c.resp} · <b>${esc(c.v)}</b> · ${esc(c.text)}</p>`).join('')).join('');
 $('#r-detall').innerHTML = `<div class="r-bloc"><h2>Puntuació per activitat</h2><div class="r-acc"><button type="button" id="r-ordena" aria-pressed="false">Ordena per punts</button><span class="r-grup" role="group" aria-label="Agrupa la taula"><button type="button" data-g="cap" aria-pressed="true">Sense grups</button><button type="button" data-g="cat" aria-pressed="false">Per categoria</button><button type="button" data-g="q" aria-pressed="false">Per quartils</button></span><button type="button" id="r-tsv">Copia la taula (TSV)</button><button type="button" id="r-txt">Copia el resum (text)</button></div><div class="r-taula" id="r-taula"></div></div>`
  + `<div class="r-bloc"><h2>Ranquing per puntuació</h2><ul class="r-rank">${rank}</ul></div>`
  + `<div class="r-bloc"><h2>Destacats</h2><ul class="r-llista"><li>Puntuació màxima (${fp(d.max)}): ${d.ambMax.join(', ')}</li><li>Puntuació negativa: ${d.negatives.length ? d.negatives.join(', ') : 'cap'}</li><li>Activitats amb almenys un N: ${d.ambN}</li></ul></div>`
  + `<div class="r-bloc r-com"><h2>Comentaris</h2>${com || '<p>Cap comentari.</p>'}</div>`;
 pintaTaula();
}
function errorMsg(e) {
 const c = e && e.message;
 if (c === 'NO_ZIP') return "Aquest fitxer no és un .docx vàlid (cal un document de Word modern; un .doc antic no serveix: desa'l com a .docx).";
 if (c === 'METODE') return 'El .docx fa servir una compressió no suportada.';
 if (c === 'SENSE_DS') return "Aquest navegador no sap descomprimir .docx: fes servir un navegador actual o enganxa el text a la caixa.";
 return 'No s\'ha pogut llegir el fitxer: ' + (c || e);
}
function falla(m) { RES = null; $('#r-detall').innerHTML = ''; $('#r-resum').innerHTML = `<div class="r-av">${esc(m)}</div>`; avis(m); }
async function carregaDocx(f) {
 try {
  const buf = await f.arrayBuffer();
  const mapa = llegeixZip(buf), en = mapa.get('word/document.xml');
  if (!en) return falla("Aquest fitxer és un ZIP, però no té word/document.xml: no és un document de Word (.docx).");
  mostra(liniesDocx(new TextDecoder('utf-8').decode(await extreuZip(buf, en))));
 } catch (e) { falla(errorMsg(e)); }
}
$('#r-fitxer').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) carregaDocx(f); ev.target.value = ''; });
const zona = $('#r-zona');
zona.addEventListener('click', () => $('#r-fitxer').click());
zona.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); $('#r-fitxer').click(); } });
zona.addEventListener('dragover', ev => { ev.preventDefault(); zona.classList.add('sobre'); });
zona.addEventListener('dragleave', () => zona.classList.remove('sobre'));
zona.addEventListener('drop', ev => {
 ev.preventDefault(); zona.classList.remove('sobre');
 const f = ev.dataTransfer && ev.dataTransfer.files[0];
 if (f) carregaDocx(f);
});
$('#r-calcula').addEventListener('click', () => {
 const t = $('#r-text').value;
 if (!t.trim()) return falla('No hi ha text per calcular: enganxa els correus a la caixa.');
 mostra(t.split(/\r?\n/));
});
$('#resultats').addEventListener('click', ev => {
 const id = ev.target.id, g = ev.target.dataset && ev.target.dataset.g;
 if (!RES) return;
 if (g) { agrupaPer = g; pintaTaula(); }
 else if (id === 'r-ordena') { ordrePunts = !ordrePunts; pintaTaula(); }
 else if (id === 'r-tsv') copiaText(tsv(RES.res, RES.items, agrupaPer, ordrePunts, SEC_NOM), 'Taula copiada (TSV), amb l\'ordre i els grups actuals.');
 else if (id === 'r-txt') copiaText(resumText(RES.res, RES.items, RES.R, RES.T, PUNTS, SEC_NOM), 'Resum copiat.');
});
const mode = () => document.body.classList.toggle('res', location.hash === '#resultats');
window.addEventListener('hashchange', mode);
mode();

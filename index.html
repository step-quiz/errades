<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Localitza l'errada · Step Quiz</title>
    <meta name="description" content="Activitats per localitzar l'errada en la resolució d'un alumne.">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/pagina.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/peu.css">
    <link rel="icon" href="icon.png">
</head>
<body>
    <main class="pagina">
        <a class="logo" href="https://step-quiz.net/" aria-label="Step Quiz: pàgina principal" title="Step Quiz"><img src="icon.png" alt="" width="96" height="64"></a>
        <h1 class="titol">Localitza l'errada</h1>
        <form class="panell" id="form-act" aria-label="Prepara l'activitat">
            <div class="fila-sel">
                <label for="act-activitat">Activitat</label>
                <select id="act-activitat" name="activitat">
                    <option value="" selected disabled>Escull una activitat</option>
                    <option value="equacions">Equacions de 1r grau</option>
                    <option value="prioritat">Prioritat d'operacions</option>
                </select>
            </div>
            <div id="act-params" hidden>
                <div class="fila-sel">
                    <label for="act-nivell">Nivell</label>
                    <select id="act-nivell" name="nivell"></select>
                </div>
                <div class="fila-sel">
                    <label for="act-total">Exemples</label>
                    <select id="act-total" name="totaloperations">
                        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                        <option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
                    </select>
                </div>
                <div class="fila-sel">
                    <label for="act-intents">Intents</label>
                    <select id="act-intents" name="maxintents">
                        <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
                    </select>
                </div>
                <div class="fila-sel">
                    <label for="act-reparteix">Repartiment</label>
                    <select id="act-reparteix" name="reparteix" title="Amb «Iguals per a tothom», tota la classe té els mateixos exemples.">
                        <option value="" selected>Diferents per a cada alumne</option>
                        <option value="1">Iguals per a tothom</option>
                    </select>
                </div>
                <div class="fila-sel separada">
                    <label for="act-encercla">Marcar la línia</label>
                    <select id="act-encercla" name="encercla" title="Automàtic: encerclant amb el dit a les pantalles tàctils i tocant amb el ratolí.">
                        <option value="auto" selected>Automàtic</option>
                        <option value="1">Encerclant</option>
                        <option value="0">Tocant</option>
                    </select>
                </div>
                <div class="fila-sel">
                    <label for="act-noerrors">Sense errada</label>
                    <select id="act-noerrors" name="noerrors" title="Si hi pot haver exemples sense cap errada, la consigna no diu mai quantes n'hi ha.">
                        <option value="0" selected>No n'hi ha mai</option>
                        <option value="1">Hi pot haver exemples</option>
                    </select>
                </div>
                <div class="fila-sel">
                    <label for="act-escriu">Correcció</label>
                    <select id="act-escriu" name="escriu" title="Escriure el terme només val quan l'errada és d'un sol terme.">
                        <option value="0" selected>Triar la línia</option>
                        <option value="1">Escriure el terme</option>
                    </select>
                </div>
                <div class="bloc-enllac">
                    <label for="act-enllac" class="lbl">Enllaç per a l'alumnat</label>
                    <input id="act-enllac" class="enllac" type="text" readonly>
                    <div class="acc">
                        <button type="button" class="b" id="act-copia">Copia</button>
                        <a class="b pri" id="act-obre" href="equacions.html">Obre</a>
                    </div>
                    <div id="act-copiat" class="avis" aria-live="polite"></div>
                </div>
            </div>
        </form>
    </main>
    <footer class="peu" title="© 2026 David Arso Civil · Departament de Matemàtiques, INS Miquel Tarradell. Contingut: CC BY-NC-SA 4.0 · Codi: MIT.">
        <a class="peu-cc" rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca"><img alt="Llicència CC BY-NC-SA" src="vendor/img/cc-by-nc-sa.svg" width="62" height="22"></a>

    </footer>
    <script type="module" src="js/index.js"></script>
</body>
</html>
